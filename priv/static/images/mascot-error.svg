<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-hidden="true">
  <!--
    SprintLens — the mascot. Something went wrong (FR-919).

    Knocked sideways, mouth gone flat and crooked. It says the thing failed;
    it does not apologise and it is not a joke in front of a failure.

    Drawn as the mark is drawn: one solid rounded shape with its features
    knocked out of it by `fill-rule="evenodd"`. Same corner radius, same tilt,
    same single colour, no outlines and no second tone — which is what stops
    the character and the logo looking like two different projects.

    It is one character with a fixed, small set of poses, and it appears only
    where there is nothing else on the screen. Never on a live board: that
    space belongs to what the team wrote.

    Decorative. Where the text beside it already says the same thing its
    alternative text is empty, so a screen reader does not say it twice.
  -->
  <path
    fill="currentColor"
    fill-rule="evenodd"
    d="M 9.43 9.36 L 18.12 7.03 A 5 5 0 0 1 24.24 10.56 L 26.11 17.52 A 5 5 0 0 1
         22.57 23.64 L 13.88 25.97 A 5 5 0 0 1 7.76 22.44 L 5.89 15.48 A 5 5 0 0 1 9.43
         9.36 Z M 14.4 14.4 A 2.0 2.0 0 1 0 10.4 14.4 A 2.0 2.0 0 1 0 14.4 14.4 Z M
         21.6 14.4 A 2.0 2.0 0 1 0 17.6 14.4 A 2.0 2.0 0 1 0 21.6 14.4 Z M 13.13 20.93
         L 17.4 19.2 A 0.9 0.9 0 0 1 18.57 19.7 L 18.57 19.7 A 0.9 0.9 0 0 1 18.07
         20.87 L 13.8 22.6 A 0.9 0.9 0 0 1 12.63 22.1 L 12.63 22.1 A 0.9 0.9 0 0 1
         13.13 20.93 Z"
  />
</svg>
