<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-hidden="true">
  <!--
    SprintLens — the mascot. Empty-handed — a list or a board with nothing on it yet (FR-917).

    Open and plain. An empty state is an invitation, so this pose does not
    look disappointed about it.

    Drawn as the mark is drawn: one solid rounded shape with its features
    knocked out of it by `fill-rule="evenodd"`. Same corner radius, same tilt,
    same single colour, no outlines and no second tone — which is what stops
    the character and the logo looking like two different projects.

    It is one character with a fixed, small set of poses, and it appears only
    where there is nothing else on the screen. Never on a live board: that
    space belongs to what the team wrote.

    Decorative. Where the text beside it already says the same thing its
    alternative text is empty, so a screen reader does not say it twice.
  -->
  <path
    fill="currentColor"
    fill-rule="evenodd"
    d="M 11.5 7.9 L 20.5 7.9 A 5 5 0 0 1 25.5 12.9 L 25.5 20.1 A 5 5 0 0 1 20.5 25.1
         L 11.5 25.1 A 5 5 0 0 1 6.5 20.1 L 6.5 12.9 A 5 5 0 0 1 11.5 7.9 Z M 14.4 14.4
         A 2.0 2.0 0 1 0 10.4 14.4 A 2.0 2.0 0 1 0 14.4 14.4 Z M 21.6 14.4 A 2.0 2.0 0
         1 0 17.6 14.4 A 2.0 2.0 0 1 0 21.6 14.4 Z M 14.25 19.75 L 17.75 19.75 A 0.85
         0.85 0 0 1 18.6 20.6 L 18.6 20.6 A 0.85 0.85 0 0 1 17.75 21.45 L 14.25 21.45 A
         0.85 0.85 0 0 1 13.4 20.6 L 13.4 20.6 A 0.85 0.85 0 0 1 14.25 19.75 Z"
  />
</svg>
